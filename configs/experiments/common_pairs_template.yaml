project: data_interaction_posttraining
pair_name: replace_me
seed: 42
scales: [1000, 5000, 10000]
data:
  a_path: data/raw/group_a.jsonl
  b_path: data/raw/group_b.jsonl
  output_dir: data/processed/replace_me
  sampling: example_count
training:
  bf16: true
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-5
  num_train_epochs: 2
  max_seq_length: 2048
  warmup_ratio: 0.03
  save_strategy: epoch
  logging_steps: 10
  seed: 42
evaluation:
  tasks: [gsm8k]
  batch_size: auto

