# Pipeline-only test with a randomly initialized tiny model; never report its scores.
training:
  bf16: false
  tf32: false
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 0.00002
  num_train_epochs: 1
  max_seq_length: 64
  gradient_checkpointing: true
  save_strategy: "no"
  logging_steps: 1
  report_to: none
  deepspeed: null
